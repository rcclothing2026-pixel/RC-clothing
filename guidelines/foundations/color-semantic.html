<!-- @dsCard group="Colors" viewport="700x170" name="Semantic roles" subtitle="Surfaces, text & accent aliases used in product code" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:22px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .cell{display:flex;flex-direction:column;gap:8px;}
  .sw{height:46px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);}
  .nm{font-size:11px;font-weight:600;color:var(--text-primary);}
  .vr{font-size:10px;color:var(--text-muted);font-family:ui-monospace,monospace;}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="sw" style="background:var(--surface-page)"></div><div class="nm">Page</div><div class="vr">--surface-page</div></div>
    <div class="cell"><div class="sw" style="background:var(--surface-card)"></div><div class="nm">Card</div><div class="vr">--surface-card</div></div>
    <div class="cell"><div class="sw" style="background:var(--surface-inverse)"></div><div class="nm">Inverse</div><div class="vr">--surface-inverse</div></div>
    <div class="cell"><div class="sw" style="background:var(--surface-inverse-2)"></div><div class="nm">Court</div><div class="vr">--surface-inverse-2</div></div>
    <div class="cell"><div class="sw" style="background:var(--brand-primary)"></div><div class="nm">Primary</div><div class="vr">--brand-primary</div></div>
    <div class="cell"><div class="sw" style="background:var(--brand-secondary)"></div><div class="nm">Secondary</div><div class="vr">--brand-secondary</div></div>
    <div class="cell"><div class="sw" style="background:var(--brand-accent)"></div><div class="nm">Accent</div><div class="vr">--brand-accent</div></div>
    <div class="cell"><div class="sw" style="background:var(--brand-accent-2)"></div><div class="nm">Accent 2</div><div class="vr">--brand-accent-2</div></div>
  </div>
</body></html>
