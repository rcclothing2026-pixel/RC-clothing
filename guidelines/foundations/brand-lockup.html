<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--navy-600);font-family:var(--font-display);padding:28px;display:flex;align-items:center;justify-content:center;}
  .lockup{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .mk{width:74px;height:74px;}
  .word{font-weight:var(--fw-semibold);font-size:52px;letter-spacing:.03em;color:var(--cream-500);line-height:.9;}
  .slogan{font-family:var(--font-script);font-size:38px;color:var(--clay-400);line-height:1;}
</style></head>
<body>
  <div class="lockup">
    <img class="mk" src="../../assets/logo/mark-cream.svg" alt="Racket Club mark">
    <div class="word">RACKET CLUB</div>
    <div class="slogan">Legends &amp; Legacy</div>
  </div>
</body></html>
