<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px base grid" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);padding:24px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .bar{background:var(--clay-600);width:var(--w);height:var(--w);border-radius:2px;}
  .l{font-size:10px;color:var(--text-muted);font-family:ui-monospace,monospace;}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="--w:4px"></div><div class="l">1·4</div></div>
    <div class="col"><div class="bar" style="--w:8px"></div><div class="l">2·8</div></div>
    <div class="col"><div class="bar" style="--w:12px"></div><div class="l">3·12</div></div>
    <div class="col"><div class="bar" style="--w:16px"></div><div class="l">4·16</div></div>
    <div class="col"><div class="bar" style="--w:24px"></div><div class="l">6·24</div></div>
    <div class="col"><div class="bar" style="--w:32px"></div><div class="l">8·32</div></div>
    <div class="col"><div class="bar" style="--w:48px"></div><div class="l">12·48</div></div>
    <div class="col"><div class="bar" style="--w:64px"></div><div class="l">16·64</div></div>
    <div class="col"><div class="bar" style="--w:80px"></div><div class="l">20·80</div></div>
  </div>
</body></html>
