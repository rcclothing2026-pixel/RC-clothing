<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);padding:22px;}
  .row{display:flex;gap:16px;}
  .tile{flex:1;height:120px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;}
  .tile img{width:64px;height:64px;display:block;}
</style></head>
<body>
  <div class="row">
    <div class="tile" style="background:var(--cream-500);border:1px solid var(--border-subtle)"><img src="../../assets/logo/mark-navy.svg" alt="mark"></div>
    <div class="tile" style="background:var(--navy-600)"><img src="../../assets/logo/mark-cream.svg" alt="mark reversed"></div>
    <div class="tile" style="background:var(--sand-500)"><img src="../../assets/logo/mark-green.svg" alt="mark green"></div>
  </div>
</body></html>
