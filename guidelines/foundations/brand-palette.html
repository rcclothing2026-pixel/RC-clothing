<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:22px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .cell{border-radius:var(--radius-sm);padding:16px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;}
  .nm{font-size:12px;font-weight:600;letter-spacing:var(--tracking-wide);}
  .hx{font-size:11px;font-family:ui-monospace,monospace;opacity:.8;text-transform:uppercase;}
</style></head>
<body>
  <div class="grid">
    <div class="cell" style="background:#18234F;color:#ECE7D0"><div class="nm">Navy</div><div class="hx">#18234F</div></div>
    <div class="cell" style="background:#034326;color:#ECE7D0"><div class="nm">Forest Green</div><div class="hx">#034326</div></div>
    <div class="cell" style="background:#A72F23;color:#ECE7D0"><div class="nm">Clay Red</div><div class="hx">#A72F23</div></div>
    <div class="cell" style="background:#672C24;color:#ECE7D0"><div class="nm">Brown</div><div class="hx">#672C24</div></div>
    <div class="cell" style="background:#C6AF92;color:#18234F"><div class="nm">Warm Beige</div><div class="hx">#C6AF92</div></div>
    <div class="cell" style="background:#ECE7D0;color:#18234F;border:1px solid var(--border-subtle)"><div class="nm">Cream</div><div class="hx">#ECE7D0</div></div>
  </div>
</body></html>
