<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racket Club — The Art of Leisure</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-page); font-family: var(--font-body); color: var(--text-primary); }
  a:hover { opacity: 0.72; }
  image-slot { width: 100%; height: 100%; display: block; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="./image-slot.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="blocks.jsx"></script>
<script type="text/babel">
function App() {
  const [bag, setBag] = React.useState([]);
  const [drawer, setDrawer] = React.useState(false);
  const addToBag = (p) => {
    setBag((cur) => {
      const found = cur.find((it) => it.id === p.id);
      if (found) return cur.map((it) => it.id === p.id ? { ...it, qty: it.qty + 1 } : it);
      return [...cur, { ...p, qty: 1 }];
    });
    setDrawer(true);
  };
  const removeFromBag = (id) => setBag((cur) => cur.filter((it) => it.id !== id));
  const count = bag.reduce((s, it) => s + it.qty, 0);
  return (
    <div>
      <Announcement />
      <Header bagCount={count} onOpenBag={() => setDrawer(true)} />
      <Hero />
      <Products onAdd={addToBag} />
      <Editorial />
      <Collections />
      <Footer />
      <CartDrawer open={drawer} items={bag} onClose={() => setDrawer(false)} onRemove={removeFromBag} />
    </div>
  );
}
function mount() {
  if (!window.Header || !window.Products || !window.RacketClubDesignSystem_3c2e87) { setTimeout(mount, 40); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script>
</body>
</html>
