<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);padding:22px;}
  .row{display:flex;gap:18px;}
  .g{flex:1;height:120px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:var(--cream-500);}
  .nm{font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:var(--text-lg);}
  .use{font-size:11px;opacity:.85;margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="g" style="background:var(--gradient-primary)"><div class="nm">Primary</div><div class="use">Hero / header / catalog cover · navy → forest, 225°</div></div>
    <div class="g" style="background:var(--gradient-accent)"><div class="nm">Accent</div><div class="use">CTA buttons / ribbons / banners · clay → brown, 180°</div></div>
  </div>
</body></html>
