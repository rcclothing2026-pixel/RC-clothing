<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:24px;}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:9px;}
  .lab{width:64px;font-size:10px;color:var(--text-muted);font-family:ui-monospace,monospace;flex:0 0 auto;}
  .xl{font-size:var(--text-xl);} .lg{font-size:var(--text-lg);} .base{font-size:var(--text-base);} .sm{font-size:var(--text-sm);}
</style></head>
<body>
  <div class="row"><span class="lab">xl / 22</span><span class="xl">The clay courts open at first light.</span></div>
  <div class="row"><span class="lab">lg / 18</span><span class="lg">The clay courts open at first light.</span></div>
  <div class="row"><span class="lab">base / 16</span><span class="base">The clay courts open at first light, mist still hanging over the nets.</span></div>
  <div class="row"><span class="lab">sm / 14</span><span class="sm">The clay courts open at first light, mist still hanging over the nets and the lines freshly drawn.</span></div>
</body></html>
