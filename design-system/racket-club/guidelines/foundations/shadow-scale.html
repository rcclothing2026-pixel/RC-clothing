<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-primary);padding:26px;}
  .row{display:flex;gap:28px;}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .sq{width:96px;height:60px;background:var(--surface-card);border-radius:var(--radius-sm);}
  .l{font-size:10px;color:var(--text-muted);font-family:ui-monospace,monospace;}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="sq" style="box-shadow:var(--shadow-xs)"></div><div class="l">xs</div></div>
    <div class="col"><div class="sq" style="box-shadow:var(--shadow-sm)"></div><div class="l">sm</div></div>
    <div class="col"><div class="sq" style="box-shadow:var(--shadow-md)"></div><div class="l">md</div></div>
    <div class="col"><div class="sq" style="box-shadow:var(--shadow-lg)"></div><div class="l">lg</div></div>
  </div>
</body></html>
