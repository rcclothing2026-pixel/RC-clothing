<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:22px;}
  .bar{display:flex;height:64px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle);}
  .seg{display:flex;align-items:center;justify-content:center;color:var(--cream-500);font-size:12px;font-weight:600;letter-spacing:var(--tracking-wide);}
</style></head>
<body>
  <div class="bar">
    <div class="seg" style="flex:60;background:var(--cream-500);color:var(--navy-600)">60% · Cream surface</div>
    <div class="seg" style="flex:30;background:var(--navy-600)">30% · Navy</div>
    <div class="seg" style="flex:5;background:var(--clay-600)">7.5</div>
    <div class="seg" style="flex:5;background:var(--sand-500);color:var(--navy-700)">beige</div>
    <div class="seg" style="flex:2.5;background:var(--green-600)"></div>
    <div class="seg" style="flex:2.5;background:var(--brown-600)"></div>
  </div>
</body></html>
