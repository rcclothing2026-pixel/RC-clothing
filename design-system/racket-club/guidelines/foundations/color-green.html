<!-- @dsCard group="Colors" viewport="700x150" name="Forest Green" subtitle="Deep forest #034326 — primary #2, body text on cream" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px 22px;}
.strip{display:flex;gap:0;}</style></head>
<body>
  <div class="strip">
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-50);border-radius:var(--radius-sm) 0 0 0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">50</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-100);border-radius:0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">100</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-200);border-radius:0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">200</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-300);border-radius:0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">300</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-400);border-radius:0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">400</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-500);border-radius:0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">500</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-600);border-radius:0;position:relative;"><span style="position:absolute;top:6px;left:7px;font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--cream-500)">BASE</span></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">600</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-700);border-radius:0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">700</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-800);border-radius:0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">800</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;">
        <div style="height:72px;background:var(--green-900);border-radius:0 var(--radius-sm) 0 0;position:relative;"></div>
        <div style="font-size:10px;color:var(--text-muted);text-align:center;padding-top:5px;font-weight:600;">900</div>
      </div>
  </div>
</body></html>
